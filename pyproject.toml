[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillarena"
version = "0.2.0"
description = "Local, reproducible A/B benchmarks for AI agent skills"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Cyber-Marty"}]
keywords = ["ai-agents", "benchmark", "skills", "evaluation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
]
dependencies = ["PyYAML>=6,<7", "typer>=0.12,<1", "Jinja2>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
skillarena = "skillarena.cli:app"

[project.urls]
Repository = "https://github.com/Cyber-Marty/SkillArena"
Issues = "https://github.com/Cyber-Marty/SkillArena/issues"

[tool.setuptools.packages.find]
include = ["skillarena*"]

[tool.setuptools.package-data]
skillarena = ["report.html.j2", "report_v2.html.j2", "starter/*", "starter/fixture/*"]
