  command: [python, "{benchmark_dir}/python_bug_fix/evaluate.py"]
repetitions: 3
timeout_seconds: 240
metadata:
  model: gpt-6-sol
  reasoning_effort: high
  authentication: ChatGPT subscription
  task_origin: synthetic code fixture
  interaction: full-file replacement, no model tools
