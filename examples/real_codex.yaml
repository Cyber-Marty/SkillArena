name: python_bug_fix_gpt6_sol_high
description: Real GPT-6 Sol High model-only runs on a small synthetic Python bug-fix task.
task:
  source: python_bug_fix/fixture
  prompt: Fix the off-by-one bug in calculate.py so the function honors its inclusive end_index contract.
skill: python_bug_fix/skill.md
runner:
  type: command
  command: [python, "{benchmark_dir}/python_bug_fix/codex_agent.py"]
