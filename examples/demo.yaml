name: python_bug_fix_demo
description: A synthetic fixture demonstrating the benchmark workflow; its results are not evidence about a real model.
task:
  source: python_bug_fix/fixture
  prompt: Fix the off-by-one bug in calculate.py so the external tests pass.
skill: python_bug_fix/skill.md
runner:
  type: command
  command: [python, "{benchmark_dir}/python_bug_fix/demo_agent.py"]
evaluation:
  command: [python, "{benchmark_dir}/python_bug_fix/evaluate.py"]
repetitions: 3
timeout_seconds: 30
