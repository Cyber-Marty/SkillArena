name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: skillarena run examples/demo.yaml --output results/ci-demo
      - run: skillarena plan examples/agent_suite.yaml
      - run: skillarena verify research/gpt6-sol-high-agent-2026-10-14/evidence
      - run: skillarena compare research/gpt6-sol-high-agent-2026-10-14/evidence --left v1 --right v2 --output results/version-comparison.json
